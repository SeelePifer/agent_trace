name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @agenttrace/web exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test
        env:
          CI: true

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenttrace
          POSTGRES_PASSWORD: agenttrace
          POSTGRES_DB: agenttrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenttrace -d agenttrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://agenttrace:agenttrace@localhost:5432/agenttrace
      AGENTTRACE_API_KEY: ci-test-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Migrate database
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm test:integration
